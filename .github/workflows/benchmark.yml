name: Physics benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: full
        type: choice
        options: [smoke, full]
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: TheSingularityWorkshop.Benchmarks.Physics
      - uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: 7c8b7c8d33ea2905568cf6dc901cdd778228b07d
          path: TheSingularityWorkshop.Physics
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Capture benchmark provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TheSingularityWorkshop.Benchmarks.Physics/results/environment
          {
            echo "benchmark_repository=TrentBest/TheSingularityWorkshop.Benchmarks.Physics"
            echo "benchmark_commit=$(git -C TheSingularityWorkshop.Benchmarks.Physics rev-parse HEAD)"
            echo "source_repository=TrentBest/TheSingularityWorkshop.Physics"
            echo "source_commit=$(git -C TheSingularityWorkshop.Physics rev-parse HEAD)"
            echo "captured_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_os=$(uname -a)"
            echo
            dotnet --info
            echo
            lscpu
          } > TheSingularityWorkshop.Benchmarks.Physics/results/environment/manifest.txt
      - name: Build benchmark harness
        run: dotnet build TheSingularityWorkshop.Benchmarks.Physics/src/TheSingularityWorkshop.Benchmarks.Physics/TheSingularityWorkshop.Benchmarks.Physics.csproj --configuration Release
      - name: Run full Physics measurements
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
        run: dotnet run --project TheSingularityWorkshop.Benchmarks.Physics/src/TheSingularityWorkshop.Benchmarks.Physics/TheSingularityWorkshop.Benchmarks.Physics.csproj --configuration Release -- --filter '*' --exporters json markdown
      - name: Run vector batch smoke benchmarks
        if: github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke'
        run: dotnet run --project TheSingularityWorkshop.Benchmarks.Physics/src/TheSingularityWorkshop.Benchmarks.Physics/TheSingularityWorkshop.Benchmarks.Physics.csproj --configuration Release -- --filter '*Vector3dBatchBenchmarks*' --job Dry
      - name: Run broadphase smoke benchmarks
        if: github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke'
        run: dotnet run --project TheSingularityWorkshop.Benchmarks.Physics/src/TheSingularityWorkshop.Benchmarks.Physics/TheSingularityWorkshop.Benchmarks.Physics.csproj --configuration Release -- --filter '*SweepAndPruneBenchmarks*' --job Dry
      - name: Run N-body smoke benchmarks
        if: github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke'
        run: dotnet run --project TheSingularityWorkshop.Benchmarks.Physics/src/TheSingularityWorkshop.Benchmarks.Physics/TheSingularityWorkshop.Benchmarks.Physics.csproj --configuration Release -- --filter '*NewtonianNBodyBenchmarks*' --job Dry
      - name: Upload BenchmarkDotNet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-benchmark-artifacts
          path: |
            BenchmarkDotNet.Artifacts/**
            TheSingularityWorkshop.Benchmarks.Physics/results/environment/**
          if-no-files-found: warn
